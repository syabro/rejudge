name: Release tagged version

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      mode:
        description: Validate main without publishing, or recover an existing tagged release
        type: choice
        options:
          - dry-run
          - recover
        default: dry-run
      version:
        description: Existing tagged version to recover; required only for recover mode
        type: string
        required: false

permissions: {}

concurrency:
  group: rejudge-release
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.13"
  NODE_VERSION: "24"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.result.outputs.publish }}
      finalize: ${{ steps.result.outputs.finalize }}
      version: ${{ steps.state.outputs.version }}
      commit: ${{ steps.state.outputs.commit }}
      automation_commit: ${{ steps.automation.outputs.commit }}
    steps:
      - name: Resolve release source
        id: trigger
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_VERSION: ${{ inputs.version }}
          TAG_DELETED: ${{ github.event.deleted }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "syabro/rejudge" ]] || {
            echo "Expected syabro/rejudge, got $GITHUB_REPOSITORY" >&2
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF_TYPE" == "tag" && "$TAG_DELETED" != "true" ]] || { echo "Release push must create a tag" >&2; exit 1; }
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Release tag must have the form v<major>.<minor>.<patch>, got $GITHUB_REF_NAME" >&2
              exit 1
            }
            mode=tag
            ref="$GITHUB_REF"
          elif [[ "$DISPATCH_MODE" == "recover" ]]; then
            [[ "$DISPATCH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Recovery requires a stable version, got $DISPATCH_VERSION" >&2
              exit 1
            }
            version="$DISPATCH_VERSION"
            mode=recover
            ref="refs/tags/v$version"
          else
            version=""
            mode=dry-run
            ref=main
          fi

          {
            echo "mode=$mode"
            echo "version=$version"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.trigger.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Select release automation
        id: automation
        shell: bash
        env:
          MODE: ${{ steps.trigger.outputs.mode }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          automation_commit=$(git rev-parse origin/main)
          script="$GITHUB_WORKSPACE/scripts/pi-autorelease.mjs"
          if [[ "$MODE" == "recover" ]]; then
            script="$RUNNER_TEMP/pi-autorelease.mjs"
            git show "$automation_commit:scripts/pi-autorelease.mjs" > "$script"
          fi
          {
            echo "RELEASE_SCRIPT=$script"
            echo "REJUDGE_RELEASE_ROOT=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"
          echo "commit=$automation_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require tag-triggered release support
        if: ${{ steps.trigger.outputs.mode == 'recover' }}
        env:
          VERSION: ${{ steps.trigger.outputs.version }}
        run: >-
          node -e 'import(process.env.RELEASE_SCRIPT).then((module) => {
          if (!Number.isInteger(module.RELEASE_AUTOMATION_VERSION) || module.RELEASE_AUTOMATION_VERSION < 2)
          throw new Error(`Current main cannot recover v${process.env.VERSION} through the tag-triggered release workflow`);
          })'

      - name: Classify release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.trigger.outputs.mode }}
          VERSION: ${{ steps.trigger.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == "dry-run" ]]; then
            node "$RELEASE_SCRIPT" classify-dry-run
          else
            node "$RELEASE_SCRIPT" classify-tag "$VERSION"
          fi

      - name: Guard explicit recovery
        if: ${{ steps.trigger.outputs.mode == 'recover' }}
        env:
          STATE: ${{ steps.state.outputs.mode }}
        run: |
          [[ "$STATE" == "recovery" || "$STATE" == "repair" || "$STATE" == "finalize" || "$STATE" == "noop" ]] || {
            echo "v${{ steps.state.outputs.version }} has no preserved release state; rerun all jobs in its original tag-push workflow run" >&2
            exit 1
          }

      - name: Report completed release
        if: ${{ steps.state.outputs.mode == 'noop' }}
        run: printf '## Release already complete\n\n`v%s` is already published on npm and GitHub.\n' "${{ steps.state.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Bun
        if: ${{ steps.state.outputs.mode == 'fresh' || steps.state.outputs.mode == 'repair' || steps.state.outputs.mode == 'dry-run' }}
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up just
        if: ${{ steps.state.outputs.mode == 'fresh' || steps.state.outputs.mode == 'repair' || steps.state.outputs.mode == 'dry-run' }}
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3.0.0
        with:
          just-version: "1.58.0"

      - name: Install and check tagged source
        if: ${{ steps.state.outputs.mode == 'fresh' || steps.state.outputs.mode == 'repair' || steps.state.outputs.mode == 'dry-run' }}
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          (cd site && bun install --frozen-lockfile)
          node "$RELEASE_SCRIPT" verify-installed
          just check
          test -s bin/rejudge.js
          test -s dist/extension.js

      - name: Pack candidate once
        if: ${{ steps.state.outputs.mode == 'fresh' || steps.state.outputs.mode == 'repair' || steps.state.outputs.mode == 'dry-run' }}
        id: candidate
        shell: bash
        env:
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/release-files"
          rm -rf "$directory"
          mkdir -p "$directory"
          npm pack --json --ignore-scripts --pack-destination "$directory" > "$RUNNER_TEMP/npm-pack.json"
          tarball="$directory/rejudge-$VERSION.tgz"
          test -f "$tarball"
          node "$RELEASE_SCRIPT" inspect-tarball "$tarball"
          manifest="$directory/rejudge-$VERSION.release.json"
          node "$RELEASE_SCRIPT" write-manifest "$tarball" "$manifest"
          {
            echo "directory=$directory"
            echo "tarball=$tarball"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke standalone CLI candidate
        if: ${{ steps.state.outputs.mode == 'fresh' || steps.state.outputs.mode == 'repair' || steps.state.outputs.mode == 'dry-run' }}
        timeout-minutes: 30
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: just smoke-package -- cli --tarball "${{ steps.candidate.outputs.tarball }}"

      - name: Smoke extension with current Pi
        if: ${{ steps.state.outputs.mode == 'fresh' || steps.state.outputs.mode == 'repair' || steps.state.outputs.mode == 'dry-run' }}
        timeout-minutes: 30
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          REJUDGE_SMOKE_PI_VERSION: ${{ steps.state.outputs.pi_version }}
        run: just smoke-package -- pi --tarball "${{ steps.candidate.outputs.tarball }}"

      - name: Smoke extension with peer-floor Pi
        if: ${{ steps.state.outputs.mode == 'fresh' || steps.state.outputs.mode == 'repair' || steps.state.outputs.mode == 'dry-run' }}
        timeout-minutes: 30
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          floor=$(node "$RELEASE_SCRIPT" peer-floor)
          REJUDGE_SMOKE_PI_VERSION="$floor" just smoke-package -- pi --tarball "${{ steps.candidate.outputs.tarball }}"

      # The draft is created only after these exact bytes pass every smoke; later recovery trusts that ordering.
      - name: Preserve tested candidate for this run
        if: ${{ steps.state.outputs.mode == 'fresh' || steps.state.outputs.mode == 'repair' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rejudge-release-${{ steps.state.outputs.version }}
          path: ${{ steps.candidate.outputs.directory }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Finish dry run
        if: ${{ steps.state.outputs.mode == 'dry-run' }}
        run: printf '## Tag-release dry run passed\n\n`%s` with Pi `%s` passed the repository and three packaged live checks. Nothing was published.\n' "${{ steps.state.outputs.version }}" "${{ steps.state.outputs.pi_version }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve candidate on draft GitHub Release
        if: ${{ steps.state.outputs.mode == 'fresh' || steps.state.outputs.mode == 'repair' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RELEASE_SCRIPT" release-reconcile "${{ steps.state.outputs.version }}" "${{ steps.candidate.outputs.directory }}"

      - name: Download preserved recovery candidate
        if: ${{ steps.state.outputs.mode == 'recovery' }}
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          directory="$RUNNER_TEMP/release-files"
          node "$RELEASE_SCRIPT" release-download "${{ steps.state.outputs.version }}" "$directory"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - name: Hand preserved recovery candidate to publish job
        if: ${{ steps.state.outputs.mode == 'recovery' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rejudge-release-${{ steps.state.outputs.version }}
          path: ${{ steps.recovery.outputs.directory }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Set job result
        id: result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          STATE: ${{ steps.state.outputs.mode }}
        run: |
          publish=false
          finalize=false
          if [[ "$STATE" == "fresh" || "$STATE" == "repair" || "$STATE" == "recovery" ]]; then
            publish=true
            finalize=true
          elif [[ "$STATE" == "finalize" ]]; then
            finalize=true
          fi
          {
            echo "publish=$publish"
            echo "finalize=$finalize"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Select release automation
        shell: bash
        env:
          AUTOMATION_COMMIT: ${{ needs.release.outputs.automation_commit }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          script="$GITHUB_WORKSPACE/scripts/pi-autorelease.mjs"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_MODE" == "recover" ]]; then
            script="$RUNNER_TEMP/pi-autorelease.mjs"
            git show "$AUTOMATION_COMMIT:scripts/pi-autorelease.mjs" > "$script"
          fi
          {
            echo "RELEASE_SCRIPT=$script"
            echo "REJUDGE_RELEASE_ROOT=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify tag, candidate, and OIDC environment
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse "refs/tags/v$VERSION^{commit}")" == "$COMMIT" ]]
          git merge-base --is-ancestor "$COMMIT" origin/main
          npm_version=$(npm --version)
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) throw new Error(`npm ${process.argv[1]} lacks Trusted Publishing support`)' "$npm_version"
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] || { echo "OIDC request URL is missing" >&2; exit 1; }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || { echo "OIDC request token is missing" >&2; exit 1; }
          [[ -z "${NPM_TOKEN:-}" && -z "${NODE_AUTH_TOKEN:-}" ]] || { echo "npm token environment must be empty" >&2; exit 1; }

      - name: Download exact tested candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rejudge-release-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/release-files

      - name: Verify exact tested candidate
        run: node "$RELEASE_SCRIPT" verify-files "$RUNNER_TEMP/release-files" "${{ needs.release.outputs.version }}"

      - name: Recheck npm immediately before publish
        run: node "$RELEASE_SCRIPT" registry-prepublish "${{ needs.release.outputs.version }}"

      - name: Publish exact tarball through Trusted Publishing
        # HTTP-level logging exposes OIDC exchange failures without printing authorization headers.
        env:
          NPM_CONFIG_LOGLEVEL: http
        run: npm publish "$RUNNER_TEMP/release-files/rejudge-${{ needs.release.outputs.version }}.tgz" --ignore-scripts --provenance

      - name: Verify npm registry bytes
        run: node "$RELEASE_SCRIPT" registry-verify "${{ needs.release.outputs.version }}" "$RUNNER_TEMP/release-files"

  finalize:
    needs: [release, publish]
    if: ${{ always() && needs.release.result == 'success' && needs.release.outputs.finalize == 'true' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Select release automation
        shell: bash
        env:
          AUTOMATION_COMMIT: ${{ needs.release.outputs.automation_commit }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          script="$GITHUB_WORKSPACE/scripts/pi-autorelease.mjs"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_MODE" == "recover" ]]; then
            script="$RUNNER_TEMP/pi-autorelease.mjs"
            git show "$AUTOMATION_COMMIT:scripts/pi-autorelease.mjs" > "$script"
          fi
          {
            echo "RELEASE_SCRIPT=$script"
            echo "REJUDGE_RELEASE_ROOT=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RELEASE_SCRIPT" release-finalize "${{ needs.release.outputs.version }}"

      - name: Verify npm provenance
        run: node "$RELEASE_SCRIPT" registry-provenance "${{ needs.release.outputs.version }}"
